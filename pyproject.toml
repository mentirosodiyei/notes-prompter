[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-prompter"
version = "0.5.0"
description = "Muestra las notas del orador de un .pptx en una pantalla extendida, sin convertir el archivo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.29",
    "python-pptx>=1.0",
    "screeninfo>=0.8",
    "psutil>=5.9",
    "Pillow>=10",
    "pystray>=0.19; sys_platform == 'win32'",
    "websockets>=12",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6"]

[project.scripts]
notes-prompter = "notes_prompter.__main__:main"
notes-prompter-gui = "notes_prompter.gui:main"

[tool.setuptools.packages.find]
include = ["notes_prompter*"]

[tool.setuptools.package-data]
notes_prompter = ["static/*", "locales/*.json", "*.applescript", "*.scpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["system_language: tests system language selection without the legacy Spanish fixture"]
