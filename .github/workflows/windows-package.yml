name: Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and tests
        run: |
          python -m pip install -e ".[dev,build]"
          python -m pytest -q
          node --test tests/browser/playback.test.cjs
          python tools/privacy_audit.py
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/jrsoftware/issrc/releases/tags/is-7_1_1'
          $asset = $release.assets | Where-Object name -eq 'innosetup-7.1.1-x64.exe'
          if (-not $asset -or $asset.digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Missing compiler digest' }
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest $asset.browser_download_url -OutFile $setup
          $actual = 'sha256:' + (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', ('/DIR="' + $compiler + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "NP_ISCC=$compiler\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build executable and installer
        shell: cmd
        run: packaging\build_installer_windows.bat "%NP_ISCC%" "%pythonLocation%\python.exe"
      - name: Exercise frozen portable and installed updater
        run: python tools/test_update_package.py --windows-exe dist/notes-prompter.exe --windows-installer dist/Notes-Prompter-Setup-0.5.1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Notes-Prompter-Windows-0.5.1
          path: dist/*.exe
          if-no-files-found: error
